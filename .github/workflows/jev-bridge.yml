name: Jev bridge
on:
  push:
    paths: ['bridge/**', '.github/workflows/jev-bridge.yml']
  pull_request:
    paths: ['bridge/**', '.github/workflows/jev-bridge.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test bridge/test.mjs
