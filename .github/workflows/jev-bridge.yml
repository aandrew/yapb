name: Jev bridge
on:
  push:
    paths: ['bridge/**', 'inc/ctstrategy.h', 'inc/economy_policy.h', 'inc/match_policy.h', 'inc/tstrategy.h', 'tests/*_standalone.cpp', '.github/workflows/jev-bridge.yml']
  pull_request:
    paths: ['bridge/**', 'inc/ctstrategy.h', 'inc/economy_policy.h', 'inc/match_policy.h', 'inc/tstrategy.h', 'tests/*_standalone.cpp', '.github/workflows/jev-bridge.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test bridge/test.mjs bridge/t-approach.test.mjs bridge/objectives.test.mjs bridge/orchestrator.test.mjs
      - run: g++ -std=c++20 -Iinc tests/ctstrategy_standalone.cpp -o /tmp/round-policy-tests && /tmp/round-policy-tests
      - run: g++ -std=c++20 -Iinc tests/economy_standalone.cpp -o /tmp/economy-tests && /tmp/economy-tests
      - run: g++ -std=c++20 -Iinc tests/match_standalone.cpp -o /tmp/match-tests && /tmp/match-tests
      - run: g++ -std=c++20 -Iinc tests/tstrategy_standalone.cpp -o /tmp/tstrategy-tests && /tmp/tstrategy-tests
