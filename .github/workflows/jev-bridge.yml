name: Jev bridge
on:
  push:
    paths: ['bridge/**', 'inc/ctstrategy.h', 'tests/ctstrategy_standalone.cpp', '.github/workflows/jev-bridge.yml']
  pull_request:
    paths: ['bridge/**', 'inc/ctstrategy.h', 'tests/ctstrategy_standalone.cpp', '.github/workflows/jev-bridge.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test bridge/test.mjs
      - run: g++ -std=c++20 -Iinc tests/ctstrategy_standalone.cpp -o /tmp/round-policy-tests && /tmp/round-policy-tests
